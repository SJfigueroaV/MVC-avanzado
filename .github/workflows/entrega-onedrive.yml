name: Entrega a OneDrive

# Genera el .zip del taller y lo sube a la carpeta del grupo, dentro de la carpeta de OneDrive
# compartida por el profesor. El secreto ONEDRIVE_CARPETA guarda la ruta completa, por ejemplo:
#   Carpeta del profesor/Talleres/Grupo Figueroa-Mejia-Betancourt
#
# IMPORTANTE: el cron de GitHub usa hora UTC. Colombia es UTC-5, así que hay que SUMAR 5 horas.
#   Ejemplo: entrega el 30 de septiembre a las 6:00 p. m. (18:00 Colombia) = 23:00 UTC
#            -> cron: "0 23 30 9 *"   y   FECHA_ENTREGA: "2026-09-30"
# GitHub puede retrasar los cron de 5 a 30 minutos: conviene programarlo con margen.

on:
  schedule:
    - cron: "30 17 25 9 *"         # 25 de septiembre, 12:30 p. m. Colombia (17:30 UTC)
  workflow_dispatch:                # Permite ejecutarlo a mano desde la pestaña Actions
    inputs:
      prueba:
        description: "Prueba: subir a la carpeta de prueba en lugar de la del profesor"
        type: boolean
        default: true

env:
  FECHA_ENTREGA: "2026-09-25"      # Fecha de entrega (hora de Colombia)
  ZIP: MVC-Avanzado-Figueroa-Mejia-Betancourt.zip
  CARPETA_PRUEBA: Prueba-Entrega-MVC

jobs:
  entregar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar la fecha
        id: fecha
        run: |
          HOY=$(TZ=America/Bogota date +%F)
          # El cron se repetiría cada año: solo se envía el día de la entrega (o a mano)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOY" != "$FECHA_ENTREGA" ]; then
            echo "Hoy es $HOY y la entrega es el $FECHA_ENTREGA: no se envía nada."
            echo "enviar=false" >> "$GITHUB_OUTPUT"
          else
            echo "enviar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar el repositorio
        if: steps.fecha.outputs.enviar == 'true'
        uses: actions/checkout@v4

      - name: Generar el .zip
        if: steps.fecha.outputs.enviar == 'true'
        run: |
          git archive --format=zip --prefix=MVC-Avanzado/ -o "$ZIP" HEAD
          unzip -l "$ZIP"

      - name: Instalar rclone
        if: steps.fecha.outputs.enviar == 'true'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone
        if: steps.fecha.outputs.enviar == 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Subir a OneDrive
        if: steps.fecha.outputs.enviar == 'true'
        env:
          CARPETA_PROFESOR: ${{ secrets.ONEDRIVE_CARPETA }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prueba }}" = "true" ]; then
            DESTINO="$CARPETA_PRUEBA"
          else
            DESTINO="$CARPETA_PROFESOR"
          fi
          echo "Subiendo $ZIP a la carpeta: $DESTINO"
          rclone copyto "$ZIP" "onedrive:$DESTINO/$ZIP" -v
          # Confirmar que el archivo quedó en OneDrive
          rclone lsl "onedrive:$DESTINO" --include "$ZIP"
